name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  api-tests:
    name: API tests (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: survey
          POSTGRES_DB: survey_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U survey -d survey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: api
        run: npm run lint

      - name: Run tests with coverage
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://survey:survey@localhost:5433/survey_test
        run: npm run test:ci

      - name: Publish API test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API test results
          path: api/test-results/api-junit.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Upload API coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage
          retention-days: 14

  web-tests:
    name: Web tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: web
        run: npm run lint

      - name: Run tests with coverage
        working-directory: web
        run: npm run test:ci

      - name: Production build (sanity check)
        working-directory: web
        run: npm run build

      - name: Publish web test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Web test results
          path: web/test-results/web-junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 14

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -t survey-api:ci -f api/Dockerfile api

      - name: Build web image
        run: docker build -t survey-web:ci -f web/Dockerfile .
